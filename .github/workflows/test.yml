name: Tests

on:
  push:
    branches: [feat-jdk11-groovy3]
  pull_request:
    branches: [feat-jdk11-groovy3]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test
